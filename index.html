<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1238" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Ateliê Estelar</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button class="lvl" id="btnProfile" aria-label="Nível">
        <span class="lvl-num" id="lvlNum">1</span>
        <span class="lvl-bar"><i id="lvlBar"></i></span>
      </button>
      <div class="brand"><img src="icon.svg" alt="" /><b>Ateliê Estelar</b></div>
      <div class="wallet" id="wallet"></div>
      <div class="top-actions">
        <button class="icon-btn" id="btnDaily" aria-label="Recompensa diária">🎁<span class="dot" id="dotDaily"></span></button>
        <button class="icon-btn" id="btnSettings" aria-label="Configurações">⚙️</button>
      </div>
    </header>

    <main id="screens">
      <section class="screen" id="scr-gacha"></section>
      <section class="screen" id="scr-studio"></section>
      <section class="screen" id="scr-scene"></section>
      <section class="screen" id="scr-events"></section>
      <section class="screen" id="scr-album"></section>
    </main>

    <nav id="bottomnav">
      <button data-scr="gacha" class="active"><span>🔮</span><b>Invocar</b></button>
      <button data-scr="studio"><span>🧑‍🎨</span><b>Estúdio</b></button>
      <button data-scr="scene"><span>🏞️</span><b>Cenário</b></button>
      <button data-scr="events"><span>🏆</span><b>Eventos</b><i class="dot" id="dotEvents"></i></button>
      <button data-scr="album"><span>📖</span><b>Álbum</b><i class="dot" id="dotAlbum"></i></button>
    </nav>
  </div>

  <div id="pull-overlay" class="hidden"></div>
  <div id="modal-root"></div>
  <div id="toasts"></div>

  <script src="js/data.js"></script>
  <script src="js/art-char.js"></script>
  <script src="js/art-scene.js"></script>
  <script src="js/store.js"></script>
  <script src="js/gacha.js"></script>
  <script src="js/ui-common.js"></script>
  <script src="js/ui-gacha.js"></script>
  <script src="js/ui-studio.js"></script>
  <script src="js/ui-scene.js"></script>
  <script src="js/ui-events.js"></script>
  <script src="js/ui-album.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
